[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-image-mcp"
version = "0.1.0"
description = "Semantic, multi-platform social image MCP crawler"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "imageio-ffmpeg>=0.6",
  "mcp>=1.6,<2",
  "pillow>=10.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.scripts]
social-image-mcp = "social_image_mcp.server:main"

[project.optional-dependencies]
browser = ["playwright>=1.45"]
semantic = ["sentence-transformers>=3.0"]
vision = ["torch>=2.2", "transformers>=4.45"]
gallery = ["gallery-dl>=1.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
